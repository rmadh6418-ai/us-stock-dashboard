name: US Stock Dashboard Daily Run

on:
  schedule:
    # 한국 시간 기준 매일 아침 7시 0분 (UTC 시간 기준 밤 10시인 22시로 설정)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동으로 언제든 테스트 실행할 수도 있게 해주는 버튼

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 깃허브 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install flask yfinance pandas requests feedparser pandas_datareader cloudscraper

      - name: 토큰 파일 복원
        run: |
          echo '${{ secrets.KAKAO_TOKEN_JSON }}' > kakao_token.json

      - name: 대시보드 HTML 생성 및 카카오톡 전송 실행
        env:
          REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python app.py
          python send_kakao.py

      - name: 생성된 index.html 자동 깃허브 반영(업데이트)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update US stock dashboard HTML by GitHub Actions" || exit 0
          git push
