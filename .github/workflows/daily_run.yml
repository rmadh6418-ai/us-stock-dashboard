name: US Stock Dashboard Daily Run

on:
  schedule:
    - cron: '15 22 * * *' # 한국시간 매일 오전 7시 15분 실행
  workflow_dispatch:

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 깃허브 코드 가져오기
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install flask yfinance pandas requests feedparser pandas_datareader cloudscraper google-generativeai

      - name: 1. 대시보드 HTML 생성 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python app.py

      - name: 2. 생성된 index.html 자동 깃허브 반영(업데이트)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update US stock dashboard HTML by GitHub Actions" || echo "No dashboard changes"
          git pull --rebase origin main
          git push

      - name: 3. 카카오톡 브리핑 전송 및 토큰 자동 갱신
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python kakao_bot.py

      - name: 4. 갱신된 카카오 토큰 깃허브 반영
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kakao_token.json
          git commit -m "chore: Update Kakao token [skip ci]" || echo "No token changes"
          git pull --rebase origin main
          git push
