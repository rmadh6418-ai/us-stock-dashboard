name: Run Kakao Briefing

on:
  schedule:
    - cron: '0 22 * * 1-5' # 한국시간 평일 오전 7시 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests yfinance cloudscraper

    - name: Run Kakao Python Script
      env:
        # 깃허브 Secrets에 등록한 카카오 API 키 가져오기
        KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      run: python kakao_bot.py

    - name: Commit and push updated token
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add kakao_token.json
        git commit -m "chore: Update Kakao token [skip ci]" || echo "No changes to commit"
        git push
